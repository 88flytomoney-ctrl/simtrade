name: Daily PnL Update

on:
  schedule:
    # Daily at 08:00 HKT (00:00 UTC) and 17:00 HKT (09:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance -q

      - name: Run PnL updater
        run: python3 update_pnl.py

      - name: Commit updated PnL summary
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/pnl_summary.json data/trades.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "🤖 Auto-update PnL summary $(date -u +%Y-%m-%d\\ %H:%M) UTC" && \
            git push

      # ── Pages deploy: upload the repo root (index.html + data/*.json) ──
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
